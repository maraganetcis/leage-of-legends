<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <radialGradient id="yasuoBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="60%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </radialGradient>
    <linearGradient id="windBlade" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#e0f2fe" />
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="100" height="100" fill="url(#yasuoBg)" />
  <!-- Wind Swirls -->
  <path d="M 10 90 Q 50 10 90 90" stroke="#38bdf8" stroke-width="3" fill="none" opacity="0.4" />
  <path d="M 20 80 Q 50 30 80 80" stroke="#7dd3fc" stroke-width="2" fill="none" opacity="0.6" />
  <!-- Shoulder Armor / Coat -->
  <path d="M 20 100 L 25 75 L 50 82 L 75 75 L 80 100 Z" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" />
  <path d="M 15 82 L 32 74 L 38 88 Z" fill="#334155" stroke="#94a3b8" stroke-width="1" />
  <!-- Face & Beard/Jaw -->
  <polygon points="50,42 62,54 58,72 50,78 42,72 38,54" fill="#fed7aa" />
  <!-- Wild Ponytail Hair -->
  <path d="M 50 25 C 30 25 25 45 28 65 C 20 50 24 30 40 20 C 45 10 60 8 72 14 C 82 20 85 40 82 55 C 75 35 68 25 50 25 Z" fill="#475569" stroke="#64748b" stroke-width="1.5" />
  <path d="M 58 16 C 65 5 78 4 88 10 C 80 15 72 20 62 20 Z" fill="#334155" />
  <!-- Scarf around neck -->
  <path d="M 36 68 Q 50 78 64 68 Q 50 84 36 68 Z" fill="#0284c7" stroke="#38bdf8" stroke-width="1.5" />
  <!-- Face Features: Eyes & Scar -->
  <line x1="44" y1="56" x2="48" y2="57" stroke="#0f172a" stroke-width="2" stroke-linecap="round" />
  <line x1="52" y1="57" x2="56" y2="56" stroke="#0f172a" stroke-width="2" stroke-linecap="round" />
  <line x1="50" y1="50" x2="52" y2="62" stroke="#ea580c" stroke-width="1.2" opacity="0.8" />
  <!-- Katana Blade Edge Glint -->
  <line x1="12" y1="92" x2="88" y2="12" stroke="url(#windBlade)" stroke-width="2.5" opacity="0.85" />
  <!-- Border Gold Ring -->
  <rect x="1" y="1" width="98" height="98" rx="8" fill="none" stroke="#c89b3c" stroke-width="2.5" />
</svg>
