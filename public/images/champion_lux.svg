<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <radialGradient id="luxBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#ca8a04" />
      <stop offset="100%" stop-color="#422006" />
    </radialGradient>
    <radialGradient id="sparkle" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="60%" stop-color="#fef08a" />
      <stop offset="100%" stop-color="#eab308" stop-opacity="0" />
    </radialGradient>
  </defs>
  <!-- Background -->
  <rect width="100" height="100" fill="url(#luxBg)" />
  <!-- Radiant Light Rays -->
  <polygon points="50,50 45,0 55,0" fill="#fef9c3" opacity="0.3" />
  <polygon points="50,50 100,20 95,30" fill="#fef9c3" opacity="0.3" />
  <polygon points="50,50 5,20 0,30" fill="#fef9c3" opacity="0.3" />
  <!-- Blonde Flowing Hair Back -->
  <ellipse cx="50" cy="55" rx="30" ry="32" fill="#fde047" />
  <path d="M 22 50 C 18 70 24 95 35 100 L 65 100 C 76 95 82 70 78 50 Z" fill="#eab308" />
  <!-- Demacian Breastplate / Collar -->
  <path d="M 30 84 L 50 94 L 70 84 L 66 100 L 34 100 Z" fill="#f8fafc" stroke="#3b82f6" stroke-width="2" />
  <polygon points="50,86 54,92 50,96 46,92" fill="#38bdf8" />
  <!-- Face -->
  <polygon points="50,42 63,52 60,68 50,76 40,68 37,52" fill="#ffedd5" />
  <!-- Eyes & Smile -->
  <circle cx="44" cy="55" r="2.5" fill="#0284c7" />
  <circle cx="56" cy="55" r="2.5" fill="#0284c7" />
  <circle cx="45" cy="54" r="0.8" fill="#ffffff" />
  <circle cx="57" cy="54" r="0.8" fill="#ffffff" />
  <path d="M 46 65 Q 50 68 54 65" stroke="#f43f5e" stroke-width="1.5" fill="none" stroke-linecap="round" />
  <!-- Bangs & Tiara -->
  <path d="M 36 40 C 44 48 56 48 64 40 C 60 34 40 34 36 40 Z" fill="#fef08a" />
  <path d="M 42 36 L 50 30 L 58 36 L 50 33 Z" fill="#38bdf8" stroke="#ffffff" stroke-width="1" />
  <!-- Sparkles -->
  <circle cx="24" cy="30" r="8" fill="url(#sparkle)" />
  <circle cx="76" cy="28" r="6" fill="url(#sparkle)" />
  <!-- Border Gold Ring -->
  <rect x="1" y="1" width="98" height="98" rx="8" fill="none" stroke="#c89b3c" stroke-width="2.5" />
</svg>
