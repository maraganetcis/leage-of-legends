<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <radialGradient id="leeBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ea580c" />
      <stop offset="60%" stop-color="#7c2d12" />
      <stop offset="100%" stop-color="#1c1917" />
    </radialGradient>
    <linearGradient id="dragonAura" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#dc2626" />
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="100" height="100" fill="url(#leeBg)" />
  <!-- Martial Arts Aura Ring -->
  <circle cx="50" cy="50" r="42" stroke="url(#dragonAura)" stroke-width="2.5" fill="none" opacity="0.6" stroke-dasharray="6,4" />
  <!-- Muscular Shoulders & Monk Wrappings -->
  <path d="M 15 100 L 25 78 L 50 84 L 75 78 L 85 100 Z" fill="#9a3412" stroke="#ea580c" stroke-width="1.5" />
  <path d="M 32 80 L 50 92 L 68 80 Z" fill="#b45309" />
  <!-- Shaved Monk Head & Strong Jaw -->
  <ellipse cx="50" cy="46" rx="18" ry="22" fill="#d97706" />
  <polygon points="50,42 63,52 60,68 50,76 40,68 37,52" fill="#d97706" />
  <!-- Braided Ponytail hanging down back -->
  <path d="M 50 24 C 54 12 65 14 62 2 C 58 10 52 14 50 24 Z" fill="#292524" />
  <!-- Iconic Red Blindfold with trailing ribbons -->
  <path d="M 32 46 L 68 46 L 67 56 L 33 56 Z" fill="#dc2626" stroke="#991b1b" stroke-width="1" />
  <!-- Dragon Rune Mark on Blindfold -->
  <polygon points="50,48 53,52 50,55 47,52" fill="#fef08a" />
  <!-- Trailing Red Ribbon Cloth Ends -->
  <path d="M 67 50 Q 82 45 92 60 Q 80 54 67 54 Z" fill="#dc2626" opacity="0.9" />
  <path d="M 67 52 Q 80 62 86 75 Q 76 66 67 56 Z" fill="#b91c1c" opacity="0.8" />
  <!-- Intense Jawline & Nose -->
  <polygon points="50,56 52,64 48,64" fill="#b45309" />
  <line x1="45" y1="69" x2="55" y2="69" stroke="#78350f" stroke-width="1.8" stroke-linecap="round" />
  <!-- Glowing Fist Fire Sparkles -->
  <circle cx="20" cy="78" r="4" fill="#fbbf24" opacity="0.8" />
  <circle cx="80" cy="78" r="4" fill="#fbbf24" opacity="0.8" />
  <!-- Border Gold Ring -->
  <rect x="1" y="1" width="98" height="98" rx="8" fill="none" stroke="#c89b3c" stroke-width="2.5" />
</svg>
