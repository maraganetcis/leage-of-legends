<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <!-- Gold Metallic Gradients -->
    <linearGradient id="goldLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF3C4" />
      <stop offset="30%" stop-color="#F0D078" />
      <stop offset="70%" stop-color="#C89B3C" />
      <stop offset="100%" stop-color="#785A28" />
    </linearGradient>
    <linearGradient id="goldDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C89B3C" />
      <stop offset="50%" stop-color="#785A28" />
      <stop offset="100%" stop-color="#3C2D14" />
    </linearGradient>
    <radialGradient id="hextechGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00F9FF" stop-opacity="0.8" />
      <stop offset="60%" stop-color="#0397AB" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#0A1428" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="gemGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38E1FF" />
      <stop offset="50%" stop-color="#0AC8B9" />
      <stop offset="100%" stop-color="#036070" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Dark Hextech Circular Base -->
  <circle cx="64" cy="64" r="60" fill="#091428" stroke="url(#goldDark)" stroke-width="3" />
  <circle cx="64" cy="64" r="54" fill="#0A1428" stroke="url(#goldLight)" stroke-width="1.5" opacity="0.8" />
  
  <!-- Subtle Hextech Inner Glow -->
  <circle cx="64" cy="64" r="46" fill="url(#hextechGlow)" />

  <!-- Outer Crest Wings & Horns -->
  <!-- Left Wing -->
  <path d="M 64 14 C 50 18 24 38 20 66 C 18 78 24 94 36 104 C 32 94 32 80 38 68 C 42 60 52 50 64 46 Z" fill="url(#goldLight)" opacity="0.9" />
  <!-- Right Wing -->
  <path d="M 64 14 C 78 18 104 38 108 66 C 110 78 104 94 92 104 C 96 94 96 80 90 68 C 86 60 76 50 64 46 Z" fill="url(#goldDark)" opacity="0.9" />

  <!-- Outer Border Ring Notches -->
  <circle cx="64" cy="8" r="3.5" fill="url(#goldLight)" />
  <circle cx="64" cy="120" r="3.5" fill="url(#goldLight)" />
  <circle cx="8" cy="64" r="3.5" fill="url(#goldLight)" />
  <circle cx="120" cy="64" r="3.5" fill="url(#goldLight)" />

  <!-- Central Shield Plate -->
  <path d="M 64 22 L 96 40 L 86 86 L 64 112 L 42 86 L 32 40 Z" fill="#05101E" stroke="url(#goldLight)" stroke-width="2.5" />

  <!-- Iconic League of Legends 'L' Glyph -->
  <!-- Shadow / Dark Bevel -->
  <path d="M 46 36 L 62 36 L 62 80 L 84 80 L 82 92 L 46 92 Z" fill="#3C2D14" />
  <!-- Main Golden Body -->
  <path d="M 48 38 L 60 38 L 60 78 L 82 78 L 80 88 L 48 88 Z" fill="url(#goldLight)" filter="url(#glow)" />
  <!-- Sharp Highlights -->
  <path d="M 48 38 L 54 38 L 54 84 L 80 84 L 80 88 L 48 88 Z" fill="#FFF8E7" opacity="0.6" />

  <!-- Hextech Magic Gemstone at Top of Crest -->
  <polygon points="64,22 70,29 64,36 58,29" fill="url(#gemGradient)" stroke="#FFF" stroke-width="0.8" />
  <circle cx="64" cy="29" r="1.5" fill="#FFF" />

  <!-- Bottom Crystal Gem -->
  <polygon points="64,104 68,109 64,114 60,109" fill="url(#gemGradient)" stroke="url(#goldLight)" stroke-width="0.8" />
</svg>
